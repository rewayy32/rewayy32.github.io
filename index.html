rm: translateY(-7px); } } /* İSİM */ .username { margin-top: 20px; font-size: 29px; font-weight: 800; } .username span { color: #9875ff; } /* SÖZ */ .quote { margin: 27px auto 0; max-width: 470px; color: #e4e4e4; font-size: 18px; line-height: 1.7; font-weight: 400; letter-spacing: .2px; text-shadow: 0 0 25px rgba(255,255,255,.08); animation: quoteAppear 1.5s ease; } @keyframes quoteAppear { from { opacity: 0; filter: blur(8px); } to { opacity: 1; filter: blur(0); } } /* SÖZÜN ALTINDAKİ İSİM */ .author { margin-top: 13px; color: #777; font-size: 12px; letter-spacing: 2px; } /* SOSYALLER */ .socials { display: flex; justify-content: center; gap: 10px; margin-top: 28px; } .social { width: 43px; height: 43px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.07); color: #aaa; text-decoration: none; transition: .25s; font-size: 17px; } .social:hover { color: white; background: #7350ff; transform: translateY(-4px); box-shadow: 0 10px 30px rgba(115,80,255,.3); } /* MÜZİK */ .music { width: 280px; max-width: 100%; margin: 22px auto 0; padding: 11px 13px; display: flex; align-items: center; gap: 11px; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.07); border-radius: 13px; backdrop-filter: blur(10px); text-align: left; } .music-icon { width: 37px; height: 37px; display: flex; align-items: center; justify-content: center; border-radius: 9px; background: rgba(120,80,255,.15); color: #9b7aff; font-size: 17px; } .music-info { flex: 1; } .music-title { font-size: 12px; font-weight: bold; } .music-artist { color: #666; margin-top: 3px; font-size: 10px; } .play { width: 31px; height: 31px; border: none; border-radius: 50%; background: #8b68ff; color: white; cursor: pointer; transition: .2s; } .play:hover { transform: scale(1.08); } /* ALT */ .footer { margin-top: 25px; color: #444; font-size: 10px; } .footer span { color: #8b68ff; } /* MOBİL */ @media(max-width: 600px) { .profile { padding: 20px; } .quote { font-size: 16px; } .username { font-size: 26px; } } </style> </head> <body> <div class="background"></div> <div class="light one"></div> <div class="light two"></div> <div class="container"> <div class="profile"> <div class="avatar"> R </div> <div class="username"> Rewayy<span>.</span> </div> <div class="quote"> “Wanting to be someone else is a waste of the person you are.” </div> <div class="author"> — KURT COBAIN </div> <div class="socials"> <a href="#" class="social"> 🎮 </a> <a href="#" class="social"> ◎ </a> <a href="#" class="social"> ▶ </a> <a href="#" class="social"> ◆ </a> </div> <div class="music"> <div class="music-icon"> ♪ </div> <div class="music-info"> <div class="music-title"> Your Favorite Song </div> <div class="music-artist"> Rewayy </div> </div> <button class="play" onclick="toggleMusic()" > ▶ </button> </div> <div class="footer"> made with <span>♥</span> by Rewayy </div> </div> </div> <script> let playing = false; function toggleMusic() { const button = document.querySelector(".play"); playing = !playing; button.textContent = playing ? "Ⅱ" : "▶"; } </script> </body> </html>

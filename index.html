<!DOCTYPE html> <html lang="tr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Rewayy</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { min-height: 100vh; overflow: hidden; font-family: Arial, Helvetica, sans-serif; color: white; background: #080808; } /* ARKA PLAN */ .background { position: fixed; inset: 0; z-index: -3; background: radial-gradient(circle at 50% 40%, rgba(100, 60, 255, .16), transparent 35%), radial-gradient(circle at 20% 80%, rgba(150, 50, 255, .08), transparent 30%), #080808; } .background::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px); background-size: 50px 50px; } /* ORTA KART */ .container { width: 100%; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; } .profile { width: 440px; max-width: 100%; padding: 32px; text-align: center; background: rgba(15, 15, 18, .78); border: 1px solid rgba(255,255,255,.08); border-radius: 22px; backdrop-filter: blur(18px); box-shadow: 0 0 70px rgba(0,0,0,.55), 0 0 100px rgba(110,60,255,.08); animation: appear .8s ease; } @keyframes appear { from { opacity: 0; transform: translateY(20px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } } /* PROFİL FOTOĞRAFI */ .avatar { width: 105px; height: 105px; margin: 0 auto 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 900; background: linear-gradient( 135deg, #6d45ff, #a855f7 ); border: 3px solid rgba(255,255,255,.12); box-shadow: 0 0 35px rgba(120,70,255,.4); animation: avatar 3s infinite ease-in-out; } @keyframes avatar { 50% { transform: translateY(-5px); box-shadow: 0 0 50px rgba(120,70,255,.55); } } /* İSİM */ .username { font-size: 31px; font-weight: 800; letter-spacing: -.5px; } .username span { color: #9d7aff; } /* UID */ .uid { margin-top: 6px; color: #777; font-size: 13px; } /* BIO */ .bio { margin: 20px auto; color: #aaa; font-size: 14px; line-height: 1.6; max-width: 330px; } /* BİLGİLER */ .info { display: flex; justify-content: center; gap: 28px; margin: 20px 0; color: #888; font-size: 12px; } .info div { display: flex; flex-direction: column; gap: 5px; } .info strong { color: #eee; font-size: 14px; } /* SOSYAL BUTONLAR */ .socials { display: flex; justify-content: center; gap: 10px; margin-top: 22px; } .social { width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); color: #bbb; text-decoration: none; font-size: 18px; transition: .25s; } .social:hover { color: white; background: #7250ff; transform: translateY(-4px); box-shadow: 0 8px 25px rgba(114,80,255,.3); } /* DISCORD */ .discord { display: block; margin-top: 20px; padding: 13px; border-radius: 12px; background: #5865f2; color: white; text-decoration: none; font-weight: 700; transition: .25s; } .discord:hover { background: #4752c4; transform: translateY(-2px); } /* MÜZİK */ .music { margin-top: 18px; padding: 12px; display: flex; align-items: center; gap: 12px; border-radius: 13px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.05); text-align: left; } .music-icon { width: 38px; height: 38px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: #18151f; color: #9d7aff; } .music-info { flex: 1; } .music-title { font-size: 13px; font-weight: bold; } .music-artist { margin-top: 3px; color: #777; font-size: 11px; } .play { border: none; width: 32px; height: 32px; border-radius: 50%; background: #9d7aff; color: white; cursor: pointer; } /* ALT */ .footer { margin-top: 22px; color: #555; font-size: 11px; } .footer span { color: #8e6cff; } /* MOBİL */ @media(max-width: 500px) { .profile { padding: 25px 20px; } .username { font-size: 27px; } .avatar { width: 90px; height: 90px; font-size: 32px; } .info { gap: 18px; } } </style> </head> <body> <div class="background"></div> <div class="container"> <div class="profile"> <!-- PROFİL FOTOĞRAFI --> <div class="avatar"> R </div> <!-- İSİM --> <div class="username"> Rewayy<span>.</span> </div> <div class="uid"> @rewayy </div> <!-- BIO --> <div class="bio"> just another person on the internet. <br> gaming • editing • discord </div> <!-- BİLGİLER --> <div class="info"> <div> <span>📍</span> <strong>Turkey</strong> </div> <div> <span>👁</span> <strong id="views">1,337</strong> </div> <div> <span>⚡</span> <strong>Online</strong> </div> </div> <!-- SOSYALLER --> <div class="socials"> <a href="#" class="social" title="Discord"> 🎮 </a> <a href="#" class="social" title="Instagram"> ◎ </a> <a href="#" class="social" title="YouTube"> ▶ </a> <a href="#" class="social" title="GitHub"> ◆ </a> </div> <!-- DISCORD --> <a class="discord" href="https://discord.com" target="_blank" > 💬 Discord'a Katıl </a> <!-- MÜZİK --> <div class="music"> <div class="music-icon"> ♪ </div> <div class="music-info"> <div class="music-title"> Your Favorite Song </div> <div class="music-artist"> Rewayy </div> </div> <button class="play" onclick="toggleMusic()"> ▶ </button> </div> <div class="footer"> made with <span>♥</span> by Rewayy </div> </div> </div> <script> /* Görüntülenme sayısını hafifçe artır */ let views = 1337; if (!sessionStorage.getItem("visited")) { views++; sessionStorage.setItem("visited", "true"); } document.getElementById("views").textContent = views.toLocaleString("en-US"); /* Müzik butonu */ let playing = false; function toggleMusic() { const button = document.querySelector(".play"); playing = !playing; if (playing) { button.textContent = "Ⅱ"; } else { button.textContent = "▶"; } } </script> </body> </html>
